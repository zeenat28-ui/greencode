name: Publish Docker Hub & GHCR Container Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Optional custom image tag (defaults to v2.1.0 or git ref)'
        required: false
        default: 'v2.1.0'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Container to Docker Hub and GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub Credentials
        id: dockerhub-config
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="zeenat28"
          fi
          echo "username=$DOCKER_USER" >> $GITHUB_OUTPUT

      # ─── Log in to GitHub Container Registry (GHCR) ───
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Log in to Docker Hub (supports ZEEMLOPS or DOCKERHUB_TOKEN) ───
      - name: Log in to Docker Hub
        env:
          DOCKER_TOKEN: ${{ secrets.ZEEMLOPS || secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub-config.outputs.username }}
          password: ${{ env.DOCKER_TOKEN }}

      # ─── Compute Tags ───
      - name: Generate Docker Tags
        id: tags
        env:
          DOCKER_TOKEN: ${{ secrets.ZEEMLOPS || secrets.DOCKERHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.custom_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.ref_name }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v2.1.0"
          fi

          DOCKER_USER="${{ steps.dockerhub-config.outputs.username }}"
          REPO_NAME="greencode"

          TAGS="ghcr.io/${{ github.repository }}:${TAG},ghcr.io/${{ github.repository }}:latest"

          if [ -n "$DOCKER_TOKEN" ]; then
            TAGS="${TAGS},${DOCKER_USER}/${REPO_NAME}:${TAG},${DOCKER_USER}/${REPO_NAME}:latest"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      # ─── Build and Push Image ───
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=GreenCode Auditor
            org.opencontainers.image.description=Software Carbon Intensity & Cloud FinOps Platform (ISO/IEC 21031 & FinOps FOCUS 1.4)
            org.opencontainers.image.url=https://greencode-teal.vercel.app
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=2.1.0
            org.opencontainers.image.licenses=Apache-2.0

