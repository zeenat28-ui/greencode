name: GreenCode Carbon Gatekeeper CI

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  audit:
    name: Green Computing Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run GreenCode Auditor Action
        uses: ./   # When published, replace with: uses: zeenat28-ui/greencode@v1
        with:
          threshold: '75.0'
          zone: 'US-CAL-CISO'
          sarif_file: 'greencode.sarif'
          sonar_file: 'greencode-sonar.json'
          upload_sarif: 'true'
          pr_comment: 'true'
          github_token: ${{ secrets.GITHUB_TOKEN }}

