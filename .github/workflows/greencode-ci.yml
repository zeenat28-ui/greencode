name: GreenCode Quality

# Why this exists: the repository shipped 201 passing tests that no workflow
# ever executed. The carbon gatekeeper below runs the auditor against source, so
# a regression in the auditor itself could pass every check. This workflow runs
# the test suite and the frontend type-check, and both must be green.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Pinned exactly, matching requirements.txt, so CI runs the same versions
      # a production image does rather than whatever resolves today.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # A strong JWT_SECRET is mandatory in production and the service refuses
      # to start without one; supplying it here keeps the guard exercised rather
      # than bypassed in CI.
      - name: Run test suite
        env:
          ENV: development
          JWT_SECRET: ci-only-not-a-production-secret-0123456789abcdef
          SECRETS_ENCRYPTION_KEY: ci-only-fernet-key-placeholder-0000000000=
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  frontend:
    name: Frontend Build and Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs from package-lock.json and fails if the lockfile and
      # manifest disagree, which is the check that catches an unpinned frontend
      # dependency before it reaches a deploy.
      - name: Install
        run: npm ci

      # The build script is `tsc --noEmit && vite build`, so a type error fails
      # the build. Previously nothing ever ran this, so the React app in
      # frontend/ could not have compiled at all.
      - name: Type-check and build
        run: npm run build

      - name: Lint
        run: npm run lint

  hardware-measurement:
    name: Hardware Energy Counter
    # Runs the project's own sensor code against real silicon. Every other test
    # injects a fake counter, which is the right way to test the arithmetic and
    # the wrong way to test the central claim: that a number labelled as a
    # measurement actually came from hardware.
    #
    # ubuntu-latest only. RAPL counters do not exist on the macOS and Windows
    # runners, so running this there would prove nothing.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Exposes the powercap counters inside the runner VM. Without this the
      # probe would report `model` and the job would pass without ever having
      # exercised a real counter.
      - name: Show raw counter presence
        run: |
          echo "powercap entries: $(find /sys/class/powercap -name energy_uj 2>/dev/null | wc -l)"
          ls -1 /sys/class/powercap 2>/dev/null || echo "no /sys/class/powercap on this runner"

      # Never fabricates a reading. On a runner with no counter this reports the
      # truth and still passes, because "correctly says it cannot measure" is
      # the property under test. It fails only when the code and the hardware
      # disagree - which is the bug that would let an estimate be reported as a
      # measurement.
      - name: Probe the counter and measure a real workload
        run: python scripts/ci_hardware_probe.py

  compose:
    name: Compose Configuration Valid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A malformed compose file, or one that still references a hardcoded
      # credential, is a deploy-time failure. Validate on every PR instead.
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-placeholder-postgres-password
          REDIS_PASSWORD: ci-placeholder-redis-password
          JWT_SECRET: ci-placeholder-jwt-secret-0123456789abcdef0123456789
          SECRETS_ENCRYPTION_KEY: ci-placeholder-fernet-key-000000000000000=
        run: docker compose config --quiet

      - name: Ensure no credential is committed in compose
        run: |
          if grep -nE 'PASSWORD: [^$]|//[^$]*:[^$@]*@' docker-compose.yml; then
            echo "::error::docker-compose.yml contains a literal credential. Use \${VAR} interpolation."
            exit 1
          fi
          echo "No literal credentials found in docker-compose.yml."

