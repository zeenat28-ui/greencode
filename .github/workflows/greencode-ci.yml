name: GreenCode Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python Test Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite
        env:
          ENV: development
          JWT_SECRET: ci-only-not-a-production-secret-0123456789abcdef
          SECRETS_ENCRYPTION_KEY: ci-only-fernet-key-placeholder-0000000000=
        run: |
          python -m pytest tests/ -v --tb=short --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  frontend:
    name: Frontend Build and Type Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        run: npm run build

  hardware-measurement:
    name: Hardware Energy Counter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show raw counter presence
        run: |
          echo "powercap entries: $(find /sys/class/powercap -name energy_uj 2>/dev/null | wc -l)"
          ls -1 /sys/class/powercap 2>/dev/null || echo "no /sys/class/powercap on this runner"

      - name: Probe the counter and measure a real workload
        run: python scripts/ci_hardware_probe.py

  compose:
    name: Compose Configuration Valid
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-placeholder-postgres-password
          REDIS_PASSWORD: ci-placeholder-redis-password
          JWT_SECRET: ci-placeholder-jwt-secret-0123456789abcdef0123456789
          SECRETS_ENCRYPTION_KEY: ci-placeholder-fernet-key-000000000000000=
        run: docker compose config --quiet

      - name: Ensure no credential is committed in compose
        run: |
          if grep -nE 'PASSWORD: [^$]|//[^$]*:[^$@]*@' docker-compose.yml; then
            echo "::error::docker-compose.yml contains a literal credential. Use \${VAR} interpolation."
            exit 1
          fi
          echo "No literal credentials found in docker-compose.yml."

  perf-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run benchmarks
        run: |
          python scripts/run_benchmarks.py
          echo "Benchmarks complete. Comparing against baseline."

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: docs/BENCHMARKS.md
