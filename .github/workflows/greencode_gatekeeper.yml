name: "GreenCode Auditor CI Quality Gate"

# The gate is only meaningful if it runs on the pull request it is meant to
# gate, and audits that PR's code. It previously ran on workflow_dispatch only,
# so no PR was ever checked automatically. `pull_request` checks out the PR head
# (the code under review) with a read-ish token; for same-repo PRs - the normal
# case here - the write scopes below are granted, so SARIF upload and the sticky
# PR comment work. (pull_request_target would grant secrets to untrusted fork
# code, which this gate does not need.)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

# security-events is required to publish the SARIF report to the Security tab;
# pull-requests write is required for the sticky PR comment. Without these the
# report is generated and then silently discarded.
permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  green-audit:
    name: "Audit Software Carbon Intensity & Green Score"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      # Input names must match action.yml exactly. This job previously passed
      # repo-path / green-score-threshold / target-zone, none of which the action
      # declares, so GitHub discarded them and every run silently fell back to
      # the defaults. It happened to produce the intended result because the
      # values happened to be identical to the defaults - any change to either
      # would have been ignored without warning.
      - name: Run GreenCode Auditor Action
        id: auditor
        uses: ./
        with:
          path: "."
          threshold: "75.0"
          zone: "US-CAL-CISO"
          sarif_file: "greencode.sarif"
          sonar_file: "greencode-sonar.json"
          upload_sarif: "true"
          pr_comment: "true"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Quality Gate Status Output
        run: |
          echo "Green Score: ${{ steps.auditor.outputs.green_score }} / 100"
          echo "Total Violations Detected: ${{ steps.auditor.outputs.total_violations }}"
          echo "Gate Passed: ${{ steps.auditor.outputs.passed }}"

      - name: Upload SARIF and SonarQube Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greencode-sast-reports
          path: |
            greencode.sarif
            greencode-sonar.json
          if-no-files-found: ignore

