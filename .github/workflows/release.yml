name: Build Release Package, GHCR Container, Checksums & CycloneDX SBOM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release-artifacts:
    name: Build Wheel, SBOM & SHA-256 Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build and SBOM tools
        run: |
          python -m pip install --upgrade pip build cyclonedx-bom
          pip install -r requirements.txt

      - name: Build Python Wheel and Source Distribution
        run: |
          python -m build --outdir dist/

      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: |
          cyclonedx-py requirements requirements.txt --of JSON -o dist/greencode-sbom.cdx.json

      - name: Generate SHA-256 Checksum Manifest
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: greencode-release-bundle
          path: dist/*
          retention-days: 30

      - name: Attach Wheel, SBOM & Checksums to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*

  publish-containers:
    name: Publish Container Image to GHCR & Docker Hub
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (if token configured)
        env:
          DOCKER_TOKEN: ${{ secrets.ZEEMLOPS || secrets.DOCKERHUB_TOKEN }}
        if: ${{ env.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'zeenat28' }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Generate Multi-Registry Tags
        id: meta
        env:
          DOCKER_TOKEN: ${{ secrets.ZEEMLOPS || secrets.DOCKERHUB_TOKEN }}
        run: |
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME || 'zeenat28' }}"
          TAGS="ghcr.io/${{ github.repository }}:${{ github.ref_name }},ghcr.io/${{ github.repository }}:latest"
          if [ -n "$DOCKER_TOKEN" ]; then
            TAGS="${TAGS},${DOCKER_USER}/greencode:${{ github.ref_name }},${DOCKER_USER}/greencode:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
