name: Secret Scanning

# Why this exists: a single credential committed once lives in git history
# forever, even after it is deleted in a later commit. This runs Gitleaks over
# the full history on every push and pull request, so a leak is caught at the
# pull request - before merge - rather than after a token has to be revoked.
#
# It gates pull requests: a detected secret fails the check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks full-history scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          # Full history is required: a secret deleted in HEAD is still in an
          # earlier commit, and that is exactly the case a shallow clone misses.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Job summary + inline PR annotations on top of the pass/fail gate.
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_ENABLE_COMMENTS: true
