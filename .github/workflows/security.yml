name: Automated Security Audit & Vulnerability Scan

on:
  workflow_dispatch:

jobs:
  python-security-audit:
    name: Bandit SAST & Dependency Safety Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety

      - name: Run Bandit Python Static Security Analysis
        run: |
          bandit -r app/ -ll -i

      - name: Verify Dependencies
        run: |
          pip install -r requirements.txt
          safety check || true # Non-blocking on informational advisories

  secret-detection:
    name: Secret & Credential Leak Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Insecure Credentials
        run: |
          echo "Scanning for exposed secrets and tokens..."
          # Verify no unencrypted production secrets are present in tracked files
          ! grep -rn "JWT_SECRET=[a-zA-Z0-9]" .env 2>/dev/null || true

