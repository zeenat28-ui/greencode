[alembic]
script_location = alembic
prepend_sys_path = .
# Required since Alembic 1.16; omitting it raises a DeprecationWarning on every
# invocation because the path separator cannot be inferred unambiguously.
path_separator = os
# The URL is resolved from the environment in alembic/env.py so migrations always
# target the same database the application uses. Never hardcode it here.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
