AWSTemplateFormatVersion: '2010-09-09'
Description: 'GreenCode Enterprise AWS HA Architecture: EKS Cluster, Aurora Serverless v2, and ElastiCache Redis'

Parameters:
  VpcCIDR:
    Description: CIDR block for VPC
    Type: String
    Default: 10.0.0.0/16

  EnvironmentName:
    Description: Environment stage
    Type: String
    Default: enterprise-prod

Resources:
  # 1. VPC Architecture
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-greencode-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # 2. Aurora Serverless v2 (PostgreSQL) for Relational Multi-Tenancy
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subnets for GreenCode DB
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-postgresql
      EngineVersion: '15.4'
      DatabaseName: greencode_enterprise
      MasterUsername: greencode_admin
      ManageMasterUserPassword: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 16.0
      DBSubnetGroupName: !Ref DBSubnetGroup
      StorageEncrypted: true

  # 3. ElastiCache Redis for High-Throughput Token Blacklisting & Grid Rate Limiting
  RedisCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      Engine: redis
      CacheNodeType: cache.t4g.medium
      NumCacheNodes: 1
      Port: 6379

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

Outputs:
  AuroraEndpoint:
    Description: Aurora PostgreSQL Primary Endpoint
    Value: !GetAtt AuroraCluster.Endpoint.Address

