apiVersion: apps/v1
kind: Deployment
metadata:
  name: greencode-gatekeeper
  namespace: greencode-system
  labels:
    app.kubernetes.io/name: greencode-gatekeeper
    app.kubernetes.io/part-of: greencode-enterprise
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: greencode-gatekeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greencode-gatekeeper
    spec:
      serviceAccountName: greencode-controller-sa
      containers:
        - name: gatekeeper
          image: ghcr.io/zeenat28-ui/greencode:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: greencode-config
            - secretRef:
                name: greencode-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: greencode-service
  namespace: greencode-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: greencode-gatekeeper

