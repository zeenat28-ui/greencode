version: '3.8'

services:
  # ----------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: greencode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: greencode
      POSTGRES_USER: greencode_user
      POSTGRES_PASSWORD: greencode_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode_user -d greencode"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 2. Redis Task Queue Broker
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: greencode-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 3. FastAPI Backend Server
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greencode-backend
    restart: unless-stopped
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://greencode_user:greencode_secure_pass@postgres:5432/greencode
      - SYNC_DATABASE_URL=postgresql://greencode_user:greencode_secure_pass@postgres:5432/greencode
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # 4. Celery Asynchronous Background Worker
  # ----------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greencode-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://greencode_user:greencode_secure_pass@postgres:5432/greencode
      - SYNC_DATABASE_URL=postgresql://greencode_user:greencode_secure_pass@postgres:5432/greencode
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------
  # 5. Streamlit Frontend Dashboard
  # ----------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greencode-frontend
    restart: unless-stopped
    command: streamlit run ui.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      - DATABASE_URL=postgresql+asyncpg://greencode_user:greencode_secure_pass@postgres:5432/greencode
      - SYNC_DATABASE_URL=postgresql://greencode_user:greencode_secure_pass@postgres:5432/greencode
      - REDIS_URL=redis://redis:6379/0
      - BACKEND_API_URL=http://backend:8000
    volumes:
      - .:/app
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

