<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GreenCode — AST analysis, hardware energy telemetry, and FinOps cost attribution." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>GreenCode</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('greencode_theme');
          var theme = stored === 'dark' || stored === 'light' ? stored : null;
          if (!theme && stored) {
            var parsed = JSON.parse(stored);
            if (parsed === 'dark' || parsed === 'light') theme = parsed;
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--gc-bg-canvas)] text-[var(--gc-text-primary)] selection:bg-emerald-500/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
