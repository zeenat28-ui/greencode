# GreenCode Energy SLA (Service Level Agreement) & Carbon Budget Configuration
# Defines operational power boundaries enforced in CI/CD quality gates and production pipelines.

version: "1.0"

energy_sla:
  name: "Production Green SLA"
  enforce_mode: "strict" # options: "strict" (block builds), "warn" (log warning)
  
  # Maximum allowable energy per single function invocation
  per_function:
    critical_path_max_joules: 15.0
    batch_processor_max_joules: 1200.0
    db_query_handler_max_joules: 25.0
    api_request_handler_max_joules: 50.0

  # Maximum allowable operational footprint per deployment / build cycle
  per_deployment:
    max_total_joules: 5000.0
    max_sci_gco2e_per_unit: 0.25
    min_green_score: 75.0

  # Monthly engineering team energy budgets (in Megajoules)
  monthly_budgets:
    core_backend: 250.0 # MJ
    ai_inference_pipeline: 1500.0 # MJ
    data_analytics: 800.0 # MJ

  # Real-time incident alert triggers
  alerts:
    warning_threshold_pct: 80.0 # Alert when reaching 80% of budget
    slack_webhook_configured: false
    auto_comment_on_pr: true

