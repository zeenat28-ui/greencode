[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greencode-auditor"
version = "1.0.0"
description = "Universal Multi-Language Green Computing Static Analyzer, Dynamic Container Profiler, and Carbon CI/CD Quality Gatekeeper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "GreenCode Team", email = "info@greencode.dev" },
]
keywords = [
    "green-software",
    "carbon-accounting",
    "sci-specification",
    "tree-sitter",
    "code-profiler",
    "ci-cd",
    "sustainability",
    "static-analysis",
    "sarif"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "streamlit>=1.32.0",
    "streamlit-code-diff>=0.1.2",
    "pandas>=2.2.0",
    "plotly>=5.20.0",
    "sqlalchemy>=2.0.28",
    "docker>=7.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.8",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.0",
    "huggingface-hub>=0.20.0",
    "tree-sitter<0.22",
    "tree-sitter-languages>=1.10.2",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "cachetools>=5.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
distributed = [
    "celery>=5.3.0",
    "redis>=5.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
greencode = "app.main:run_cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

