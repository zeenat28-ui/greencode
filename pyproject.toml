[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "greencode-auditor"
version = "2.0.0"
description = "Static code energy analyzer, IaC FinOps linter, FOCUS 1.4 billing reconciler, and ISO/IEC 21031 (GSF SCI) carbon gatekeeper"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Zeenat Riaz" },
]
keywords = [
    "green-software",
    "carbon-accounting",
    "finops",
    "focus-1.4",
    "sci-specification",
    "iac-linter",
    "code-profiler",
    "ci-cd",
    "sustainability",
    "static-analysis",
    "sarif",
    "mcp-server",
    "aws-bedrock"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/zeenat28-ui/greencode"
Repository = "https://github.com/zeenat28-ui/greencode"
Issues = "https://github.com/zeenat28-ui/greencode/issues"
Funding = "https://opencollective.com/greencode"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "requests>=2.31.0",
    "psutil>=5.9.8",
    "pydantic>=2.6.4",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.1.2",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "cachetools>=5.3",
    "httpx>=0.27",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
mcp = [
    "mcp>=1.0.0",
    "huggingface-hub>=0.20.0",
]
treesitter = [
    "tree-sitter<0.22",
    "tree-sitter-languages>=1.10.2",
]
distributed = [
    "celery>=5.3.0",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "docker>=7.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
greencode = "app.main:run_cli"
greencode-mcp = "app.mcp_server:main"
greencode-aws = "app.aws_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["py.typed"]
